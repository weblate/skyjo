# PostgreSQL configuration for WAL archiving and continuous backup
# Minimal configuration focused on backup functionality

# WAL Configuration for Continuous Archiving
wal_level = replica
archive_mode = on
archive_command = 'mkdir -p /backups/wal && cp %p /backups/wal/%f'
archive_timeout = 300

# Essential Connection Settings
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'

# Logging Configuration for Backup Monitoring
log_checkpoints = on
log_connections = on
log_disconnections = on

# Auto-vacuum Configuration
autovacuum = on