services:
  web:
    image: maxentr/skymo:web-${IMAGE_TAG:-prod-latest}
    pull_policy: always
    ports:
      - "3000:3000"
    networks:
      - internal
      - external
    env_file:
      - .env
      - ./apps/web/.env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  api:
    image: maxentr/skymo:api-${IMAGE_TAG:-prod-latest}
    pull_policy: always
    ports:
      - "3001:3001"
    networks:
      - internal
      - external
    env_file:
      - .env
      - ./apps/api/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NODE_OPTIONS=--max-old-space-size=8192 --max-http-header-size=16384 --use-largepages=silent
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  workers:
    image: maxentr/skymo:workers-${IMAGE_TAG:-prod-latest}
    pull_policy: always
    networks:
      - internal
    env_file:
      - .env
      - ./apps/workers/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NODE_OPTIONS=--max-old-space-size=2048 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  discord-bot:
    image: maxentr/skymo:discord-bot-${IMAGE_TAG:-prod-latest}
    pull_policy: always
    networks:
      - internal
      - external
    env_file:
      - .env
      - ./apps/discord-bot/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NODE_OPTIONS=--max-old-space-size=1024 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

networks:
  internal:
  external:
