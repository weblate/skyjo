parameters:
  - name: nodeVersion
    type: string
  - name: pnpmVersion
    type: string

stages:
  - stage: Test
    displayName: "Test"
    jobs:
      - job: TestWithCoverage
        displayName: "Run Tests with Coverage"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: "Checkout code (shallow)"

          - template: ../steps/setup-node-pnpm.yml
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - script: |
              pnpm test:coverage -- --run --reporter=default --reporter=junit --outputFile.junit=test-results.xml
            displayName: "Run tests with coverage"
            continueOnError: false

          - task: PublishTestResults@2
            displayName: "Publish test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/test-results.xml"
              failTaskOnFailedTests: true
              testRunTitle: "Skymo Tests"

          # Publish coverage from each package that has coverage
          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage (API)"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "apps/api/tests/coverage/coverage-final.json"
              failIfCoverageEmpty: false

          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage (Core)"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "packages/core/coverage/coverage-final.json"
              failIfCoverageEmpty: false

          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage (State Operations)"
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "packages/state-operations/coverage/coverage-final.json"
              failIfCoverageEmpty: false

          # Archive coverage reports for debugging
          - task: PublishPipelineArtifact@1
            displayName: "Archive coverage reports"
            condition: succeededOrFailed()
            inputs:
              targetPath: "."
              patterns: |
                **/coverage/**
                **/test-results.xml
              artifact: "test-coverage-reports"
              publishLocation: "pipeline"
