# Azure Pipelines CI/CD for Skymo Discord Bot
# Triggers on trunk push when Discord Bot or its dependencies change
# Note: No test stage as discord-bot has no tests

trigger:
  branches:
    include:
      - trunk
  paths:
    include:
      - apps/discord-bot/**
      - packages/core/**
      - packages/database/**
      - packages/logger/**
      - packages/shared/**
    exclude:
      - "**/*.md"

pr: none

parameters:
  - name: environment
    displayName: "Environment"
    type: string
    default: "prod"
    values:
      - prod
      - dev

variables:
  - group: skymo-${{ parameters.environment }}

stages:
  # Build Docker image (no test stage - discord-bot has no tests)
  - stage: Build
    displayName: "Build Docker Image"
    jobs:
      - job: BuildDocker
        displayName: "Build Discord Bot"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - script: |
              docker version
              docker buildx version
            displayName: "Display Docker info"

          - script: |
              docker buildx create --name builder --use
              docker buildx inspect --bootstrap
            displayName: "Setup BuildKit"

          - script: |
              docker buildx build \
                --file ./apps/discord-bot/Dockerfile \
                --label "org.opencontainers.image.source=https://github.com/maxentr/skymo" \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --tag skymo/discord-bot:${{ parameters.environment }}-$(Build.BuildId) \
                --tag skymo/discord-bot:$(Build.SourceVersion) \
                --load \
                .
            displayName: "Build Docker image"

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/docker-images
              docker save skymo/discord-bot:${{ parameters.environment }}-$(Build.BuildId) | gzip > $(Build.ArtifactStagingDirectory)/docker-images/discord-bot-${{ parameters.environment }}-$(Build.BuildId).tar.gz
              ls -lh $(Build.ArtifactStagingDirectory)/docker-images/
            displayName: "Export Docker image as tar.gz"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Docker image artifact"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/docker-images/discord-bot-${{ parameters.environment }}-$(Build.BuildId).tar.gz"
              artifact: "discord-bot-image-${{ parameters.environment }}"
              publishLocation: "pipeline"
