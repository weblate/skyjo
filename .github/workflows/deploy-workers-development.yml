name: Deploy Workers Development

on:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22.10.0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.6.5

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test -- --run

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Use a separate directory for development
            cd dev/skymo

            git pull

            docker logout ghcr.io

            docker compose -f compose.dev.yml down dev-workers
            docker compose -f compose.dev.yml pull dev-workers
            docker compose -f compose.dev.yml up -d dev-workers --build

            docker image prune -a
            docker volume prune -f
