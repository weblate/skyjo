name: Deploy Development

on:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: 24.3.0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test -- --run

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # Use a separate directory for development
            if [ ! -d "dev/skymo" ]; then
              git clone https://github.com/maxentr/skymo.git dev/skymo
            fi

            cd dev/skymo
            git pull

            # Enable Docker buildx for better caching
            docker buildx create --use --name skymo-dev-builder --driver docker-container 2>/dev/null || docker buildx use skymo-dev-builder

            # Enable Docker buildx with resource-aware configuration
            docker buildx create --use --name skymo-dev-builder --driver docker-container \
              --driver-opt network=host \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760 \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SPEED=10485760 \
              2>/dev/null || docker buildx use skymo-dev-builder

            # Configure build with controlled parallelism for development
            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain
            export BUILDKIT_HOST_MEMORY_LIMIT=2g

            # Use parallel builds - development uses less memory than production
            docker compose -f compose.dev.yml build --parallel dev-api dev-workers dev-web

            pnpm i
            pnpm db:migrate

            docker compose -f compose.dev.yml up -d dev-api dev-workers dev-web
