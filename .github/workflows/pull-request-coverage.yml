name: "Test and Report Coverage on PRs"
on:
  pull_request:
    branches:
      - trunk
      - "!weblate"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.22.0

      - name: Install dependencies
        run: pnpm install

      - name: "Test"
        run: pnpm test:coverage

      - name: "Report API coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "API"
          vite-config-path: "./apps/api/vitest.config.ts"
          json-summary-path: "./apps/api/tests/coverage/coverage-summary.json"
          json-final-path: "./apps/api/tests/coverage/coverage-final.json"

      - name: "Report Core coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Core"
          vite-config-path: "./packages/core/vitest.config.ts"
          json-summary-path: "./packages/core/tests/coverage/coverage-summary.json"
          json-final-path: "./packages/core/tests/coverage/coverage-final.json"

      - name: "Report Workers coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with: 
          name: "Workers"
          vite-config-path: "./apps/workers/vitest.config.ts"
          json-summary-path: "./apps/workers/tests/coverage/coverage-summary.json"
          json-final-path: "./apps/workers/tests/coverage/coverage-final.json"

      - name: "Report Web coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with: 
          name: "Web"
          vite-config-path: "./apps/web/vitest.config.ts"
          json-summary-path: "./apps/web/tests/coverage/coverage-summary.json"
          json-final-path: "./apps/web/tests/coverage/coverage-final.json"
