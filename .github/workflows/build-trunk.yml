name: Build and Push Docker Images

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      force_build_api:
        description: 'Force rebuild API'
        required: false
        type: boolean
        default: false
      force_build_web:
        description: 'Force rebuild Web'
        required: false
        type: boolean
        default: false
      force_build_workers:
        description: 'Force rebuild Workers'
        required: false
        type: boolean
        default: false
      force_build_discord_bot:
        description: 'Force rebuild Discord Bot'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
      discord-bot: ${{ steps.filter.outputs.discord-bot }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            workers:
              - 'apps/workers/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            discord-bot:
              - 'apps/discord-bot/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  test-and-build:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Non-web apps (build once)
          - name: api
            package: '@skymo/api'
            changed: ${{ needs.detect-changes.outputs.api }}
            force: ${{ inputs.force_build_api }}
            environment: production
          - name: workers
            package: '@skymo/workers'
            changed: ${{ needs.detect-changes.outputs.workers }}
            force: ${{ inputs.force_build_workers }}
            environment: production
          - name: discord-bot
            package: '@skymo/discord-bot'
            changed: ${{ needs.detect-changes.outputs.discord-bot }}
            force: ${{ inputs.force_build_discord_bot }}
            environment: production
          # Web app (build twice - once per environment)
          - name: web
            package: '@skymo/web'
            changed: ${{ needs.detect-changes.outputs.web }}
            force: ${{ inputs.force_build_web }}
            environment: production
          - name: web
            package: '@skymo/web'
            changed: ${{ needs.detect-changes.outputs.web }}
            force: ${{ inputs.force_build_web }}
            environment: dev
    environment: ${{ matrix.environment }}
    steps:
      - name: Skip if no changes and not forced
        if: matrix.changed != 'true' && matrix.force != true
        run: |
          echo "No changes detected for ${{ matrix.name }} and not forced, skipping..."
          exit 0

      - name: Checkout
        if: matrix.changed == 'true' || matrix.force == true
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.changed == 'true' || matrix.force == true
        uses: actions/setup-node@v4
        with:
          node-version: 24.3.0

      - name: Setup pnpm
        if: matrix.changed == 'true' || matrix.force == true
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        if: matrix.changed == 'true' || matrix.force == true
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        if: matrix.changed == 'true' || matrix.force == true
        run: pnpm test --filter ${{ matrix.package }} -- --run

      - name: Set up Docker Buildx
        if: matrix.changed == 'true' || matrix.force == true
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: matrix.changed == 'true' || matrix.force == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: matrix.changed == 'true' || matrix.force == true
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.environment && format('trunk-{0}', matrix.environment) || 'trunk' }}
            type=sha,prefix=${{ matrix.environment && format('trunk-{0}-', matrix.environment) || 'trunk-' }},format=short

      - name: Build and push Docker image
        if: matrix.changed == 'true' || matrix.force == true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.name }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha${{ matrix.environment && format(',scope={0}-{1}', matrix.name, matrix.environment) || '' }}
          cache-to: type=gha,mode=max${{ matrix.environment && format(',scope={0}-{1}', matrix.name, matrix.environment) || '' }}
          build-args: |
            PROJECT=${{ matrix.package }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_ENVIRONMENT={0}', vars.NEXT_PUBLIC_ENVIRONMENT) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_SITE_URL={0}', vars.NEXT_PUBLIC_SITE_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_POSTHOG_KEY={0}', vars.NEXT_PUBLIC_POSTHOG_KEY) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_POSTHOG_HOST={0}', vars.NEXT_PUBLIC_POSTHOG_HOST) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_CONTACT_EMAIL={0}', vars.NEXT_PUBLIC_CONTACT_EMAIL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_DISCORD_URL={0}', vars.NEXT_PUBLIC_DISCORD_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_STATUS_URL={0}', vars.NEXT_PUBLIC_STATUS_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_GITHUB_URL={0}', vars.NEXT_PUBLIC_GITHUB_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_RELEASE_NOTES_URL={0}', vars.NEXT_PUBLIC_RELEASE_NOTES_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_WEBLATE_URL={0}', vars.NEXT_PUBLIC_WEBLATE_URL) || '' }}

      - name: Image digest
        if: matrix.changed == 'true' || matrix.force == true
        run: echo "Built and pushed ${{ steps.meta.outputs.tags }}"
