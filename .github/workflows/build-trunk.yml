name: Build images

on:
  # push:
  #   branches:
  #     - trunk
  workflow_dispatch:
    inputs:
      build_api:
        description: 'Build API'
        required: false
        type: boolean
        default: true
      build_web_production:
        description: 'Build Web (Production)'
        required: false
        type: boolean
        default: true
      build_web_dev:
        description: 'Build Web (Dev)'
        required: false
        type: boolean
        default: true
      build_workers:
        description: 'Build Workers'
        required: false
        type: boolean
        default: true
      build_discord_bot:
        description: 'Build Discord Bot'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
      discord-bot: ${{ steps.filter.outputs.discord-bot }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            workers:
              - 'apps/workers/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            discord-bot:
              - 'apps/discord-bot/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  test-and-build:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Non-web apps (build once)
          - name: api
            package: '@skymo/api'
            changed: ${{ needs.detect-changes.outputs.api }}
            build: ${{ inputs.build_api }}
            environment: production
          - name: workers
            package: '@skymo/workers'
            changed: ${{ needs.detect-changes.outputs.workers }}
            build: ${{ inputs.build_workers }}
            environment: production
          - name: discord-bot
            package: '@skymo/discord-bot'
            changed: ${{ needs.detect-changes.outputs.discord-bot }}
            build: ${{ inputs.build_discord_bot }}
            environment: production
          # Web app (build twice - once per environment)
          - name: web
            package: '@skymo/web'
            changed: ${{ needs.detect-changes.outputs.web }}
            build: ${{ inputs.build_web_production }}
            environment: production
          - name: web
            package: '@skymo/web'
            changed: ${{ needs.detect-changes.outputs.web }}
            build: ${{ inputs.build_web_dev }}
            environment: dev
    environment: ${{ matrix.environment }}
    steps:
      - name: Skip if no changes or not selected
        if: (github.event_name == 'push' && matrix.changed != 'true') || (github.event_name == 'workflow_dispatch' && matrix.build != true)
        run: |
          echo "Skipping ${{ matrix.name }}: no changes detected or not selected for manual build"
          exit 0

      - name: Checkout
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Setup pnpm
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Install dependencies
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        run: pnpm test --filter ${{ matrix.package }} -- --run

      - name: Set up Docker Buildx
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=trunk-${{ matrix.environment == 'production' && 'prod' || matrix.environment }}-latest
            type=sha,prefix=trunk-${{ matrix.environment == 'production' && 'prod' || matrix.environment }}-,format=short

      - name: Build and push Docker image
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.name }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.environment == 'production' && 'prod' || matrix.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.environment == 'production' && 'prod' || matrix.environment }}
          build-args: |
            PROJECT=${{ matrix.package }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_ENVIRONMENT={0}', vars.NEXT_PUBLIC_ENVIRONMENT) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_SITE_URL={0}', vars.NEXT_PUBLIC_SITE_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_POSTHOG_KEY={0}', vars.NEXT_PUBLIC_POSTHOG_KEY) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_CONTACT_EMAIL={0}', vars.NEXT_PUBLIC_CONTACT_EMAIL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_DISCORD_URL={0}', vars.NEXT_PUBLIC_DISCORD_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_STATUS_URL={0}', vars.NEXT_PUBLIC_STATUS_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_GITHUB_URL={0}', vars.NEXT_PUBLIC_GITHUB_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_RELEASE_NOTES_URL={0}', vars.NEXT_PUBLIC_RELEASE_NOTES_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_WEBLATE_URL={0}', vars.NEXT_PUBLIC_WEBLATE_URL) || '' }}

      - name: Image digest
        if: (github.event_name == 'push' && matrix.changed == 'true') || (github.event_name == 'workflow_dispatch' && matrix.build == true)
        run: echo "Built and pushed ${{ steps.meta.outputs.tags }}"
