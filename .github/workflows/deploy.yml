name: Deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # check if the directory exists. If not, clone the repository
            if [ ! -d "skymo" ]; then
              git clone https://github.com/maxentr/skymo.git
            fi

            cd skymo
            git pull

            # Enable Docker buildx with advanced caching
            docker buildx create --use --name skymo-prod-builder --driver docker-container \
              --driver-opt network=host \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760 \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SPEED=10485760 \
              2>/dev/null || docker buildx use skymo-prod-builder

            # Configure build with controlled parallelism and inline cache
            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain
            export BUILDKIT_HOST_MEMORY_LIMIT=3g
            export COMPOSE_DOCKER_CLI_BUILD=1

            echo "Building with parallel execution and inline cache..."

            # Build with inline cache export for better layer reuse
            docker compose build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --parallel api workers discord-bot web

            pnpm i
            pnpm db:migrate

            docker compose up -d api workers discord-bot web
