name: Deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # check if the directory exists. If not, clone the repository
            if [ ! -d "skymo" ]; then
              git clone https://github.com/maxentr/skymo.git
            fi

            cd skymo
            git pull

            COMPOSE_BAKE=true docker compose build \
              --parallel api workers discord-bot web

            pnpm i
            pnpm db:migrate

            docker compose up -d
