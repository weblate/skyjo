services:
  dev-web:
    image: ${DEV_WEB_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-maxentr}/web:${DEV_IMAGE_TAG:-trunk-preprod}}
    pull_policy: always
    ports:
      - "2000:3000"
    networks:
      - dev-internal
      - dev-external
    env_file:
      - .env
      - ./apps/web/.env
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=2048 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  dev-api:
    image: ${DEV_API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-skymo}/api:${DEV_IMAGE_TAG:-trunk}}
    pull_policy: always
    depends_on:
      - dev-redis
    ports:
      - 2001:2001
    networks:
      - dev-internal
      - dev-external
    env_file:
      - .env
      - ./apps/api/.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://:${REDIS_PASSWORD}@dev-redis:${REDIS_PORT}
      - NODE_OPTIONS=--max-old-space-size=8192 --max-http-header-size=16384 --use-largepages=silent
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  dev-workers:
    image: ${DEV_WORKERS_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-skymo}/workers:${DEV_IMAGE_TAG:-trunk}}
    pull_policy: always
    depends_on:
      - dev-redis
    networks:
      - dev-internal
    env_file:
      - .env
      - ./apps/workers/.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://:${REDIS_PASSWORD}@dev-redis:${REDIS_PORT}
      - NODE_OPTIONS=--max-old-space-size=2048 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  dev-discord-bot:
    image: ${DEV_DISCORD_BOT_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-skymo}/discord-bot:${DEV_IMAGE_TAG:-trunk}}
    pull_policy: always
    networks:
      - dev-internal
      - dev-external
    env_file:
      - .env
      - ./apps/discord-bot/.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://:${REDIS_PASSWORD}@dev-redis:${REDIS_PORT}
      - NODE_OPTIONS=--max-old-space-size=1024 --expose-gc
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  dev-redis:
    image: redis/redis-stack-server:latest
    command: >
      redis-server 
      --port ${REDIS_PORT}
      --loadmodule /opt/redis-stack/lib/rejson.so 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 10gb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --io-threads 4
      --tcp-keepalive 300
      --maxclients 10000
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --loglevel notice
      --client-output-buffer-limit normal 0 0 0
      --client-output-buffer-limit replica 256mb 64mb 60
      --client-output-buffer-limit pubsub 32mb 8mb 60
    volumes:
      - dev-redis-data:/data
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - dev-internal
      - dev-external
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: always

  dev-postgres:
    image: postgres:17.4-alpine3.21
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    networks:
      - dev-internal
      - dev-external
    env_file:
      - .env

networks:
  dev-internal:
  dev-external:

volumes:
  dev-redis-data:
  dev-postgres-data:
