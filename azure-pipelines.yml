trigger: none
pr: none

name: $(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: environment
    displayName: "Environment"
    type: string
    default: "prod"
    values:
      - prod
      - dev
  - name: skipTest
    displayName: "Skip Test Stage"
    type: string
    default: "false"
    values:
      - "true"
      - "false"
  - name: buildApi
    displayName: "Build API"
    type: string
    default: "true"
    values:
      - "true"
      - "false"
  - name: buildWeb
    displayName: "Build Web"
    type: string
    default: "true"
    values:
      - "true"
      - "false"
  - name: buildWorkers
    displayName: "Build Workers"
    type: string
    default: "true"
    values:
      - "true"
      - "false"
  - name: buildDiscordBot
    displayName: "Build Discord Bot"
    type: string
    default: "true"
    values:
      - "true"
      - "false"

variables:
  - group: skymo-${{ parameters.environment }}
  - name: nodeVersion
    value: "24.13.0"
  - name: pnpmVersion
    value: "10.22.0"
  - name: dockerRepository
    value: "maxentr/skymo"

stages:
  # Stage 1: Test all apps
  - stage: Test
    displayName: "Test"
    condition: eq('${{ parameters.skipTest }}', 'false')
    jobs:
      - job: Test
        displayName: "Run All Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - task: UseNode@1
            displayName: "Setup Node.js"
            inputs:
              version: $(nodeVersion)

          - script: |
              corepack enable
              corepack prepare pnpm@$(pnpmVersion) --activate
            displayName: "Setup pnpm"

          - script: pnpm install --frozen-lockfile
            displayName: "Install dependencies"

          - script: pnpm build
            displayName: "Build all packages"

          - script: pnpm test:coverage -- --run --reporter=default --reporter=junit --outputFile=test-results.xml
            displayName: "Run tests with coverage"

          - task: PublishTestResults@2
            displayName: "Publish test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/test-results.xml"
              failTaskOnFailedTests: true
              testRunTitle: "Skymo Tests"

  # Stage 2: Build selected apps
  - stage: Build
    displayName: "Build"
    dependsOn: Test
    condition: or(succeeded(), eq('${{ parameters.skipTest }}', 'true'))
    jobs:
      # Build API
      - job: BuildAPI
        displayName: "Build API"
        condition: eq('${{ parameters.buildApi }}', 'true')
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - task: Docker@2
            displayName: "Build and push API image"
            inputs:
              containerRegistry: "dockerhub"
              repository: $(dockerRepository)
              command: "buildAndPush"
              Dockerfile: "./apps/api/Dockerfile"
              buildContext: "."
              tags: |
                api-${{ parameters.environment }}-$(Build.BuildNumber)
                api-${{ parameters.environment }}-latest

      # Build Web
      - job: BuildWeb
        displayName: "Build Web"
        condition: eq('${{ parameters.buildWeb }}', 'true')
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - task: Docker@2
            displayName: "Docker Login"
            inputs:
              containerRegistry: "dockerhub"
              command: "login"

          - script: |
              docker buildx build \
                --build-arg PROJECT=@skymo/web \
                --build-arg "NEXT_PUBLIC_ENVIRONMENT=$(NEXT_PUBLIC_ENVIRONMENT)" \
                --build-arg "NEXT_PUBLIC_SITE_URL=$(NEXT_PUBLIC_SITE_URL)" \
                --build-arg "NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)" \
                --build-arg "NEXT_PUBLIC_POSTHOG_KEY=$(NEXT_PUBLIC_POSTHOG_KEY)" \
                --build-arg "NEXT_PUBLIC_CONTACT_EMAIL=$(NEXT_PUBLIC_CONTACT_EMAIL)" \
                --build-arg "NEXT_PUBLIC_DISCORD_URL=$(NEXT_PUBLIC_DISCORD_URL)" \
                --build-arg "NEXT_PUBLIC_STATUS_URL=$(NEXT_PUBLIC_STATUS_URL)" \
                --build-arg "NEXT_PUBLIC_GITHUB_URL=$(NEXT_PUBLIC_GITHUB_URL)" \
                --build-arg "NEXT_PUBLIC_RELEASE_NOTES_URL=$(NEXT_PUBLIC_RELEASE_NOTES_URL)" \
                --build-arg "NEXT_PUBLIC_WEBLATE_URL=$(NEXT_PUBLIC_WEBLATE_URL)" \
                -t $(dockerRepository):web-${{ parameters.environment }}-$(Build.BuildNumber) \
                -t $(dockerRepository):web-${{ parameters.environment }}-latest \
                -f ./apps/web/Dockerfile \
                --push \
                .
            displayName: "Build and push Web image"

      # Build Workers
      - job: BuildWorkers
        displayName: "Build Workers"
        condition: eq('${{ parameters.buildWorkers }}', 'true')
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - task: Docker@2
            displayName: "Build and push Workers image"
            inputs:
              containerRegistry: "dockerhub"
              repository: $(dockerRepository)
              command: "buildAndPush"
              Dockerfile: "./apps/workers/Dockerfile"
              buildContext: "."
              tags: |
                workers-${{ parameters.environment }}-$(Build.BuildNumber)
                workers-${{ parameters.environment }}-latest

      # Build Discord Bot
      - job: BuildDiscordBot
        displayName: "Build Discord Bot"
        condition: eq('${{ parameters.buildDiscordBot }}', 'true')
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: "1"
            displayName: "Checkout code (shallow)"

          - task: Docker@2
            displayName: "Build and push Discord Bot image"
            inputs:
              containerRegistry: "dockerhub"
              repository: $(dockerRepository)
              command: "buildAndPush"
              Dockerfile: "./apps/discord-bot/Dockerfile"
              buildContext: "."
              tags: |
                discord-bot-${{ parameters.environment }}-$(Build.BuildNumber)
                discord-bot-${{ parameters.environment }}-latest

